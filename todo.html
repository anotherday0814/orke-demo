<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할 일 목록</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card: #1b1e25;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --border: #2c313a;
      --accent: #4f8cff;
      --danger: #f05252;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }
  .container {
    max-width: 560px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }
  h1 { margin: 0 0 16px; font-size: 1.5rem; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
  }
  .add-btn {
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--border);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
  li .text { flex: 1; word-break: break-word; }
  li.done .text { text-decoration: line-through; color: var(--muted); }
  .delete-btn {
    padding: 4px 10px;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--border);
  }
  .delete-btn:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .clear-btn { background: transparent; color: var(--muted); text-decoration: underline; padding: 0; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
  <div class="container">
    <h1>할 일 목록</h1>
    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요" autocomplete="off" aria-label="새 할 일">
      <button type="submit" class="add-btn">추가</button>
    </form>
    <ul id="todo-list"></ul>
    <p class="empty" id="empty-msg">할 일이 없습니다. 새 항목을 추가해 보세요!</p>
    <div class="footer">
      <span id="count"></span>
      <button type="button" class="clear-btn" id="clear-done">완료 항목 삭제</button>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'todo-items';
  const form = document.getElementById('todo-form');
  const input = document.getElementById('todo-input');
  const list = document.getElementById('todo-list');
  const emptyMsg = document.getElementById('empty-msg');
  const count = document.getElementById('count');
  const clearDone = document.getElementById('clear-done');

  let todos = load();

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
      // 저장 실패 시에도 화면은 계속 동작
    }
  }

  function render() {
    list.innerHTML = '';
    todos.forEach(todo => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.setAttribute('aria-label', '완료 표시');
      checkbox.addEventListener('change', () => {
        todo.done = checkbox.checked;
        save();
        render();
      });

      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = todo.text;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-btn';
      del.textContent = '삭제';
      del.addEventListener('click', () => {
        todos = todos.filter(t => t.id !== todo.id);
        save();
        render();
      });

      li.append(checkbox, text, del);
      list.appendChild(li);
    });

    const remaining = todos.filter(t => !t.done).length;
    emptyMsg.hidden = todos.length > 0;
    count.textContent = `남은 할 일 ${remaining}개 / 전체 ${todos.length}개`;
    clearDone.hidden = !todos.some(t => t.done);
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({ id: Date.now() + Math.random(), text, done: false });
    save();
    render();
    input.value = '';
    input.focus();
  });

  clearDone.addEventListener('click', () => {
    todos = todos.filter(t => !t.done);
    save();
    render();
  });

  render();
</script>
</body>
</html>
